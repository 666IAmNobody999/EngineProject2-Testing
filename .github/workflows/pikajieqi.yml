# 幻神揭棋引擎 (PikaJieQi) universal release builds, ported from the 幻神引擎 workflow.
#
# Each artifact is ONE binary that contains several PGO-optimised ISA slices and
# picks the best one for the running CPU at start-up (src/universal/):
#   Windows-x86-64-universal : x86-64, sse41-popcnt, avx2, bmi2 (avx2 on Zen1/2), avx512
#   Android-x86-64-universal : same slices, NDK / bionic, static
#   Android-arm64-universal  : armv8, armv8.2-a+dotprod, NDK / bionic, static
name: PikaJieQi

on:
  push:
  workflow_dispatch:

jobs:
  Windows-x86-64:
    name: Windows-x86-64-universal
    runs-on: windows-latest
    env:
      # Built under an ASCII name, released under the 幻神 name.
      EXE: 幻神揭棋引擎-Windows-x86-64-universal.exe
    defaults:
      run:
        working-directory: src
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - name: Setup msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils make git tar

      # GitHub-hosted runners may lack AVX-512, so every slice's PGO bench runs
      # under Intel SDE.
      - name: Setup Intel SDE
        uses: petarpetrovt/setup-sde@v6.0

      - name: Compile universal PGO build
        run: |
          SDE="$(cygpath -u "$SDE_PATH")/sde.exe"
          COMP=mingw PGO=yes JOBS=4 RUN_PREFIX="$SDE -future --" \
            OUT=pikajieqi-build.exe universal/build.sh x86-64
          strip pikajieqi-build.exe
          cp pikajieqi-build.exe "../$EXE"

      - name: Bench (native CPU slice and baseline slice)
        run: |
          ./pikajieqi-build.exe bench 16 1 10 2>&1 | tail -n 3
          PIKAJIEQI_SLICE=x86_64 ./pikajieqi-build.exe bench 16 1 10 2>&1 | tail -n 3

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXE }}
          path: ${{ env.EXE }}

  # GUI trainer (tools/nnue/trainer_gui.py) frozen into one exe with the
  # universal engine inside. It still runs training with the user's own
  # installed Python + numpy + torch.
  Windows-NNUE-Trainer:
    name: Windows-NNUE-Trainer
    needs: Windows-x86-64
    runs-on: windows-latest
    env:
      ENGINE: 幻神揭棋引擎-Windows-x86-64-universal.exe
      TRAINER: 幻神揭棋引擎-NNUE訓練器-Windows.exe
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ENGINE }}
          path: build-engine

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build trainer exe (PyInstaller)
        run: |
          Copy-Item "build-engine/$env:ENGINE" build-engine/pikajieqi.exe
          python -m pip install --upgrade pip pyinstaller
          python -m PyInstaller --noconfirm --onefile --windowed --name PikaJieQi-NNUE-Trainer `
            --add-data "tools/nnue/jqnnue.py;scripts" --add-data "tools/nnue/train.py;scripts" `
            --add-data "tools/nnue/export.py;scripts" --add-data "tools/nnue/gendata.py;scripts" `
            --add-data "tools/nnue/verify.py;scripts" --add-data "tools/jieqi_match.py;scripts" `
            --add-binary "build-engine/pikajieqi.exe;engine" tools/nnue/trainer_gui.py
          Copy-Item dist/PikaJieQi-NNUE-Trainer.exe $env:TRAINER

      - name: Self-test (generate -> train -> export -> engine check)
        run: |
          python -m pip install numpy torch --index-url https://download.pytorch.org/whl/cpu
          $p = Start-Process -FilePath "dist/PikaJieQi-NNUE-Trainer.exe" -ArgumentList "--selftest", "$env:RUNNER_TEMP\st" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\st\selftest.log" -Encoding utf8 | Select-Object -Last 15
          if ($p.ExitCode -ne 0) { throw "selftest exit code $($p.ExitCode)" }
          if (-not (Select-String -Path "$env:RUNNER_TEMP\st\selftest.log" -Pattern "SELFTEST PASSED" -Quiet)) { throw "selftest failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TRAINER }}
          path: ${{ env.TRAINER }}

  Android:
    name: Android-${{ matrix.config.arch }}-universal
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          # The PGO bench of a (static) Android binary runs on the Linux runner:
          # arm64 slices under QEMU user mode, x86-64 slices under Intel SDE.
          - arch: arm64
            target: arm64
            runner: qemu
          - arch: x86-64
            target: x86-64
            runner: sde
    env:
      EXE: 幻神揭棋引擎-Android-${{ matrix.config.arch }}-universal
    defaults:
      run:
        working-directory: src

    steps:
      - uses: actions/checkout@v4

      - name: Install NDK
        run: |
          NDKV="28.2.13676358"
          ANDROID_ROOT=/usr/local/lib/android
          ANDROID_SDK_ROOT=$ANDROID_ROOT/sdk
          SDKMANAGER=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
          echo "y" | $SDKMANAGER "ndk;$NDKV" > /dev/null
          echo "$ANDROID_SDK_ROOT/ndk/$NDKV/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Install QEMU user mode
        if: matrix.config.runner == 'qemu'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user

      - name: Setup Intel SDE
        if: matrix.config.runner == 'sde'
        uses: petarpetrovt/setup-sde@v6.0

      - name: Compile universal PGO build
        run: |
          if [ "${{ matrix.config.runner }}" = "qemu" ]; then
            PREFIX="qemu-aarch64 -cpu max"
          else
            PREFIX="$SDE_PATH/sde64 -future --"
          fi
          # Static: runs on any Android version and in QEMU/SDE for the PGO bench.
          COMP=ndk PGO=yes JOBS=4 RUN_PREFIX="$PREFIX" \
            LDFLAGS="-static -Wno-unused-command-line-argument" \
            OUT=pikajieqi-build universal/build.sh ${{ matrix.config.target }}
          llvm-strip pikajieqi-build
          cp pikajieqi-build "../$EXE"

      - name: Bench
        run: |
          if [ "${{ matrix.config.runner }}" = "qemu" ]; then
            qemu-aarch64 -cpu cortex-a53 ./pikajieqi-build bench 16 1 8 2>&1 | tail -n 3
            qemu-aarch64 -cpu max        ./pikajieqi-build bench 16 1 8 2>&1 | tail -n 3
          else
            ./pikajieqi-build bench 16 1 10 2>&1 | tail -n 3
            PIKAJIEQI_SLICE=x86_64 ./pikajieqi-build bench 16 1 10 2>&1 | tail -n 3
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXE }}
          path: ${{ env.EXE }}
